[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
audio = { version = "0.1.0", path = "../audio" }
exec = { version = "0.1.0", path = "../exec" }
reach-core = { version = "0.1.0", path = "../core" }
nlu = { version = "0.1.0", path = "../nlu" }
reach-runtime = { version = "0.1.0", path = "../runtime" }
screen = { version = "0.1.0", path = "../screen" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stt = { version = "0.1.0", path = "../stt" }
tts = { version = "0.26.3", default-features = false }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Console"] }

[lints]
workspace = true
