<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reach Status</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card" data-tone="asleep">
      <div class="topline">
        <span class="brand">REACH</span>
        <span class="indicator" id="indicator" aria-hidden="true"></span>
        <span class="state" id="state" role="status" aria-live="polite">ASLEEP</span>
      </div>
      <p class="heard" id="heard">Say “Reach” to start.</p>
      <p class="result" id="result">Say “Reach” to start.</p>
    </main>
    <script src="status.js"></script>
  </body>
</html>
